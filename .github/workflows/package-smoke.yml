name: Package a Rails app end to end

# The acceptance test for the packaging chain. Nothing here is mocked: it
# builds the interpreter, generates a real Rails app, packs it into a bundle,
# prunes it, signs it, then launches the result and talks to it over HTTP.
#
# Ad-hoc signing is used because CI has no Developer ID. That is enough to
# exercise the hardened runtime, which is where Ruby and macOS actually
# disagree — see packaging/DISTRIBUTION.md for what it cannot tell us.
#
# Every step that is not the packer itself is the gem's own tooling,
# desktop-rails-tool, run by the runner's Ruby.

on:
  workflow_dispatch:
  push:
    paths:
      - "packaging/**"
      - "desktop-rails/exe/**"
      - "desktop-rails/lib/desktop_rails/tooling.rb"
      - "desktop-rails/lib/desktop_rails/tooling/**"
      - ".github/workflows/package-smoke.yml"

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The Ruby that runs the tooling, not the one being built.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"

      - name: Cache the vendored dependencies
        uses: actions/cache@v4
        with:
          path: .runtime-build/vendor
          key: vendor-arm64-darwin-openssl4.0.2-libdir-yaml0.2.5

      - name: Build the interpreter
        run: ruby desktop-rails/exe/desktop-rails-tool runtime build --out "$PWD/out/ruby"

      - name: It relocates
        run: ruby desktop-rails/exe/desktop-rails-tool runtime verify "$PWD/out/ruby"

      - name: Generate a Rails app with the interpreter we just built
        run: |
          set -euo pipefail
          export GEM_HOME="$PWD/out/gems"
          GEM_PATH="$GEM_HOME:$(echo "$PWD"/out/ruby/lib/ruby/gems/*)"
          export GEM_PATH
          export PATH="$PWD/out/ruby/bin:$GEM_HOME/bin:$PATH"

          # railties rather than the full rails meta-gem: a desktop app has one
          # user and no cable server, so actioncable is not part of the payload.
          gem install railties --no-document
          rails new "$PWD/example" --minimal --skip-git --skip-bundle --skip-action-cable

          cp packaging/smoke/Gemfile "$PWD/example/Gemfile"
          cd "$PWD/example" && bundle install
          echo "app generated and bundled"

      - name: Pack, prune and sign
        run: |
          packaging/pack.sh \
            --app "$PWD/example" \
            --runtime "$PWD/out/ruby" \
            --gems "$PWD/out/gems" \
            --name "Smoke" --bundle-id dev.desktop-rails.smoke \
            --out "$PWD/dist"

      - name: Launch the bundle and talk to it
        run: ruby desktop-rails/exe/desktop-rails-tool smoke launch dist/Smoke.app/Contents/MacOS/launch

      # The shell is what a person double-clicks. Everything above proves the
      # server half; this builds the GUI in and drives the whole chain.
      #
      # A clean runner matters here: this could not be made to run repeatably on
      # a developer machine after a long session, and the check itself caused
      # some of that — see Tooling::Smoke on writing inside a signed bundle. It
      # passed first time on a runner, so it gates rather than warns.
      - name: Pack again with the GUI shell embedded
        id: gui
        run: |
          set -euo pipefail
          (cd src-tauri && cargo build --release)
          packaging/pack.sh \
            --app "$PWD/example" --runtime "$PWD/out/ruby" --gems "$PWD/out/gems" \
            --shell src-tauri/target/release/desktop-rails \
            --name "SmokeGui" --bundle-id dev.desktop-rails.smokegui \
            --out "$PWD/dist-gui"

      - name: Drive the whole chain through the shell
        run: ruby desktop-rails/exe/desktop-rails-tool smoke shell dist-gui/SmokeGui.app/Contents/MacOS/desktop-rails

      - name: Build the disk image
        run: ruby desktop-rails/exe/desktop-rails-tool dmg dist/Smoke.app

      - name: What Gatekeeper makes of it
        run: |
          # Expected to be rejected: CI has no Developer ID. Recorded rather
          # than asserted, so the day that changes is visible in the log.
          echo "codesign: $(codesign --verify --strict dist/Smoke.app 2>&1 && echo pass || echo fail)"
          echo "spctl:    $(spctl -a -vv dist/Smoke.app 2>&1 | head -2 | tr '\n' ' ')"

      - name: Sizes
        run: |
          du -sh out/ruby dist/Smoke.app dist/Smoke.dmg | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-dmg
          path: dist/*.dmg
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential zlib1g-dev rsync

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"

      - name: Cache the vendored dependencies
        uses: actions/cache@v4
        with:
          path: .runtime-build/vendor
          key: vendor-x86_64-linux-openssl4.0.2-libdir-yaml0.2.5

      - name: Build the interpreter
        run: ruby desktop-rails/exe/desktop-rails-tool runtime build --out "$PWD/out/ruby"

      - name: It relocates
        run: ruby desktop-rails/exe/desktop-rails-tool runtime verify "$PWD/out/ruby"

      - name: Generate a Rails app with the interpreter we just built
        run: |
          set -euo pipefail
          export GEM_HOME="$PWD/out/gems"
          GEM_PATH="$GEM_HOME:$(echo "$PWD"/out/ruby/lib/ruby/gems/*)"
          export GEM_PATH
          export PATH="$PWD/out/ruby/bin:$GEM_HOME/bin:$PATH"
          gem install railties --no-document
          rails new "$PWD/example" --minimal --skip-git --skip-bundle --skip-action-cable
          cp packaging/smoke/Gemfile "$PWD/example/Gemfile"
          cd "$PWD/example" && bundle install

      - name: Pack
        run: |
          packaging/pack-linux.sh \
            --app "$PWD/example" \
            --runtime "$PWD/out/ruby" \
            --gems "$PWD/out/gems" \
            --name "Smoke" --app-id dev.desktop-rails.smoke \
            --out "$PWD/dist"

      - name: Launch it and talk to it
        run: ruby desktop-rails/exe/desktop-rails-tool smoke launch dist/smoke/bin/smoke

      - name: It runs from somewhere else entirely, and read-only
        run: |
          set -euo pipefail
          # The tarball is the artifact people unpack wherever they like, often
          # somewhere they cannot write. Both need to work.
          mkdir -p /tmp/elsewhere && tar -C /tmp/elsewhere -xzf dist/smoke-linux-*.tar.gz
          chmod -R a-w /tmp/elsewhere/smoke
          ruby desktop-rails/exe/desktop-rails-tool smoke launch /tmp/elsewhere/smoke/bin/smoke
          chmod -R u+w /tmp/elsewhere/smoke

      # The GUI half, which the tarball above does not carry. Linux needs the
      # webkit and gtk headers to build the shell at all.
      - name: Shell build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Pack again with the GUI shell embedded
        run: |
          set -euo pipefail
          (cd src-tauri && cargo build --release)
          packaging/pack-linux.sh \
            --app "$PWD/example" --runtime "$PWD/out/ruby" --gems "$PWD/out/gems" \
            --shell src-tauri/target/release/desktop-rails \
            --name "SmokeGui" --app-id dev.desktop-rails.smokegui \
            --out "$PWD/dist-gui"

      - name: Drive the whole chain through the shell
        # A GUI process needs a display even to start; xvfb provides one.
        run: |
          sudo apt-get install -y -qq xvfb
          xvfb-run -a ruby desktop-rails/exe/desktop-rails-tool smoke shell dist-gui/smokegui/smokegui

      - name: Sizes
        run: du -sh out/ruby dist/smoke dist/smoke-linux-*.tar.gz | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: dist/*.tar.gz
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A separate Ruby with a devkit, to run the tooling and to compile the
      # gems. Several ship source-only on Windows (puma, io-console, nio4r), so a
      # compiler is needed at build time. The end user never installs gems. It
      # has to be the version the shipped interpreter is, or the compiled
      # extensions would not load in it.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"

      # The interpreter that ships: RubyInstaller's portable archive, which
      # already relocates (spike 3). Not built here, because building a second
      # one would be work for its own sake.
      - name: Fetch the portable interpreter
        shell: pwsh
        run: |
          ruby desktop-rails\exe\desktop-rails-tool runtime fetch-windows --version 4.0.7 --out "$env:GITHUB_WORKSPACE\out\ruby"
          if ($LASTEXITCODE -ne 0) { throw "the portable interpreter did not check out" }

      - name: Generate a Rails app and build its gems
        shell: pwsh
        run: |
          ridk version
          New-Item -ItemType Directory -Force -Path C:\example | Out-Null
          gem install railties --no-document
          rails new C:\example --minimal --skip-git --skip-bundle --skip-action-cable
          Copy-Item packaging\smoke\Gemfile C:\example\Gemfile -Force
          # GEM_HOME, not BUNDLE_PATH. BUNDLE_PATH nests gems under
          # ruby/<abi>/gems while GEM_HOME keeps them flat, and the launcher
          # looks for flat — as macOS and Linux already produce.
          $env:GEM_HOME = "$env:GITHUB_WORKSPACE\out\gems"
          $env:GEM_PATH = "$env:GITHUB_WORKSPACE\out\gems"
          Push-Location C:\example
          bundle install
          if ($LASTEXITCODE -ne 0) { throw "bundle install failed" }
          Pop-Location

      - name: Pack
        shell: pwsh
        run: |
          packaging\pack-windows.ps1 -App C:\example `
            -Runtime "$env:GITHUB_WORKSPACE\out\ruby" `
            -Gems "$env:GITHUB_WORKSPACE\out\gems" `
            -Name "Smoke" -AppId dev.desktop-rails.smoke `
            -Out "$env:GITHUB_WORKSPACE\dist"

      - name: Launch it with no toolchain present
        shell: pwsh
        run: |
          # The shipping condition: hide every compiler, then run what we built.
          foreach ($d in @("C:\msys64", "C:\mingw64")) {
            if (Test-Path $d) { Rename-Item $d "$d-hidden" }
          }
          try {
            # Checked by the portable interpreter, which needs no toolchain
            # either, rather than by a Ruby whose devkit was just hidden.
            & "$env:GITHUB_WORKSPACE\out\ruby\bin\ruby.exe" desktop-rails\exe\desktop-rails-tool smoke launch "$env:GITHUB_WORKSPACE\dist\smoke\smoke.cmd"
            if ($LASTEXITCODE -ne 0) { throw "the packaged app did not hold to its contract" }
          } finally {
            foreach ($d in @("C:\msys64-hidden", "C:\mingw64-hidden")) {
              if (Test-Path $d) { Rename-Item $d ($d -replace "-hidden$", "") }
            }
          }

      - name: Pack again with the GUI shell embedded
        shell: pwsh
        run: |
          Push-Location src-tauri
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "the shell did not build" }
          Pop-Location
          packaging\pack-windows.ps1 -App C:\example `
            -Runtime "$env:GITHUB_WORKSPACE\out\ruby" `
            -Gems "$env:GITHUB_WORKSPACE\out\gems" `
            -Shell "$env:GITHUB_WORKSPACE\src-tauri\target\release\desktop-rails.exe" `
            -Name "SmokeGui" -AppId dev.desktop-rails.smokegui `
            -Out "$env:GITHUB_WORKSPACE\dist-gui"

      - name: The GUI tree carries what it should
        shell: pwsh
        run: |
          # Windows has no headless display here, so this checks the shape
          # rather than launching: the exe, its config, and the launcher it
          # spawns must all be present and agree with each other.
          $dir = "$env:GITHUB_WORKSPACE\dist-gui\smokegui"
          foreach ($f in @("smokegui.exe", "desktop-rails.config.json", "smokegui.cmd")) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
            Write-Host "  present: $f"
          }
          $config = Get-Content "$dir\desktop-rails.config.json" -Raw | ConvertFrom-Json
          if ($config.server.command -ne "smokegui.cmd") {
            throw "the config points at $($config.server.command), which is not the launcher"
          }
          Write-Host "  config spawns $($config.server.command)"

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: dist/*.zip
          retention-days: 7
