name: Native features, end to end

# Notifications, the badge, global shortcuts and menu items, proven from outside
# the app rather than by what the bridge answers. Those four components once
# answered "shown" and "registered" while doing nothing, and a test that only
# read the answer would have passed.
#
# e2e/native is a one-file Rails app the shell starts itself, so it has the
# control channel and its Ruby can notify. Its page calls every component, and
# e2e/native/check.rb then asserts:
#
#   Linux, under Xvfb with a window manager and a session D-Bus:
#     * the page's and Ruby's notifications reached org.freedesktop.Notifications
#       (a stand-in service that logs every Notify call as it crossed the bus),
#     * the badge went out as the Unity LauncherEntry signal docks read,
#     * a combination another X client holds (xbindkeys) is refused,
#     * xdotool pressing the config's summon shortcut brings the window forward
#       from behind another application's window (or, where a bare X session
#       will not move focus, from being minimized), and the page hears it,
#     * pressing a shortcut the page registered reaches the page once, and once
#       unregistered, nothing,
#     * a menu item's accelerator reaches the page,
#     * clicking the notification (the service's ActionInvoked signal) reaches
#       the page and brings the window forward.
#
#   macOS: what the platform lets a runner observe. The calls' answers, Ruby's
#   notification being accepted by NSUserNotificationCenter, and a best-effort
#   synthetic key press that is reported but not failed on, because posting
#   key events needs an Accessibility grant the runner may not have.
#
# The shell is built from this commit.

on:
  push:
  workflow_dispatch:

concurrency:
  group: native-features-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: "4.0.7"

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, platform: linux }
          - { name: macOS, os: macos-14, platform: macos }
    steps:
      - uses: actions/checkout@v4

      - name: A place for logs
        run: |
          echo "LOGS=$RUNNER_TEMP/native-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-logs"

      - name: Linux desktop, build libraries and test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool xbindkeys x11-utils dbus \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: e2e/native

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the shell from this commit
        working-directory: src-tauri
        run: cargo build

      # One display and one session bus for every step after this one, which is
      # why they are started here rather than by xvfb-run or dbus-run-session:
      # those give them to a single command.
      - name: Start a display and a session bus
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > "$LOGS/xvfb.log" 2>&1 &
          dbus-daemon --session --fork --address="unix:path=$RUNNER_TEMP/session-bus" --print-address=1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$RUNNER_TEMP/session-bus" >> "$GITHUB_ENV"

      # check.rb starts xbindkeys itself and waits until its grab actually
      # fires, so the app cannot register the combination first.
      - name: A window manager, a notification service, and a shortcut someone else holds
        if: runner.os == 'Linux'
        run: |
          openbox > "$LOGS/openbox.log" 2>&1 &
          (cd e2e/native && bundle exec ruby notification_service.rb --log "$LOGS/notifications.jsonl" > "$LOGS/notification-service.out" 2>&1 &)
          ruby e2e/native/check.rb session --logs "$LOGS"

      # macOS notifies on behalf of an app bundle, so the shell runs from one.
      - name: Wrap the shell in a registered .app
        if: runner.os == 'macOS'
        run: |
          ruby e2e/native/check.rb bundle-macos "$PWD/src-tauri/target/debug/desktop-rails" --logs "$LOGS" | tee "$LOGS/bundle.out"
          echo "SHELL_BIN=$(tail -n 1 "$LOGS/bundle.out")" >> "$GITHUB_ENV"

      # A shell's background job, not a Ruby subprocess: see e2e/hosted/check.rb.
      # Run from e2e/native, where a debug shell finds its config.
      - name: Launch the app and check what reached the OS
        env:
          REPORTS_FILE: ${{ env.LOGS }}/reports.jsonl
          NATIVE_LOG: ${{ env.LOGS }}/app.log
        run: |
          bin="${SHELL_BIN:-$PWD/src-tauri/target/debug/desktop-rails}"
          (cd e2e/native && RUST_LOG=info "$bin" > "$LOGS/shell.log" 2>&1 & echo $! > "$LOGS/shell.pid")
          ruby e2e/native/check.rb run --platform ${{ matrix.platform }} --logs "$LOGS"

      - name: Stop everything
        if: always()
        run: |
          kill "$(cat "$LOGS/shell.pid" 2>/dev/null)" 2>/dev/null || true
          pkill -f "e2e/native/serve" || true
          pkill -f notification_service.rb || true

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ matrix.name }}
          path: ${{ env.LOGS }}
          if-no-files-found: ignore
