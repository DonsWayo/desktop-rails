name: A fresh Rails app, end to end

# The user journey, followed literally, on a machine that has never seen the
# app: `rails new`, add the gem, run its generator, `bin/rails desktop:runtime`,
# `bin/rails desktop:package`, launch the result and look at what the window
# loaded. The runtime and the shell are whatever those tasks download from the
# release matching the gem's version — nothing is cached, and nothing is
# compiled here, because that is what a user gets.
#
# package-smoke.yml proves the packaging chain with a hand-picked Gemfile. That
# is exactly what let a generated app break: path gems, development groups, an
# unconfigured database and a schema nobody loaded were all invisible to it.
#
# Then examples/notes, which additionally proves the native bridge from inside
# the running window in both directions — JavaScript to the shell, and Ruby to
# the shell over the control channel — and Turbo Streams over the framework's
# SSE path. Each is asserted from outside the app, through files the app writes
# into DESKTOP_DATA_DIR. The example is packaged with the shell built from this
# commit, so a change to the shell is tested before it is released.

on:
  push:
  workflow_dispatch:

# A newer push makes an older run's answer irrelevant, and each run holds a
# macOS runner for a long time.
concurrency:
  group: fresh-app-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_VERSION: "8.1.3.1"
  RUBY_VERSION: "4.0.7"

jobs:
  unix:
    name: ${{ matrix.platform.name }}, Rails ${{ matrix.rails.version }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macOS, os: macos-14, gui: "" }
          - { name: Linux, os: ubuntu-24.04, gui: "xvfb-run -a" }
        # The fresh app once for every Rails the README says is tested, each at
        # the latest patch of its series, so that claim is this job's to make.
        # The first is RAILS_VERSION above, which the Windows job uses.
        #
        # examples/notes locks its own Rails, so running it for every entry would
        # test the same app twice. It runs with the newest only.
        #
        # 7.0 and 7.1 are past Rails' own maintenance, but the gemspec allows
        # them, so they are proven rather than assumed. They are what found that
        # the boot scripts read the app's config/puma.rb.
        rails:
          - { version: "8.1.3.1", example: true }
          - { version: "7.2.3.2", example: false }
          - { version: "7.1.6", example: false }
          - { version: "7.0.10", example: false }
    env:
      FRESH: ${{ github.workspace }}/../fresh
      RAILS_VERSION: ${{ matrix.rails.version }}
    steps:
      - uses: actions/checkout@v4

      # What a Linux desktop has: a display to open a window on, and the webview
      # the shell links against. No tray library: the downloaded shell must
      # start without one, as it will on a minimal desktop.
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libwebkit2gtk-4.1-0 libgtk-3-0 rsync

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # ─── A brand new app, with downloaded runtime and shell ────────────────

      - name: rails new
        run: |
          set -euo pipefail
          gem install rails -v "$RAILS_VERSION" --no-document
          git config --global user.email ci@example.com
          git config --global user.name CI
          rails "_${RAILS_VERSION}_" new "$FRESH"

      - name: Add the gem by path and run its generator
        working-directory: ${{ env.FRESH }}
        run: |
          set -euo pipefail
          bundle add desktop-rails --path "$GITHUB_WORKSPACE/desktop-rails"
          bin/rails generate desktop_rails:install
          bundle install
          git status --short

      # The one thing a person adds before there is anything to look at: a new
      # app has no root route, and a production-like environment shows no
      # welcome page.
      - name: Give the app a page
        working-directory: ${{ env.FRESH }}
        run: |
          set -euo pipefail
          bin/rails generate controller Welcome index
          ruby -i -pe 'sub(/^Rails\.application\.routes\.draw do$/) { "#{$&}\n  root \"welcome#index\"" }' config/routes.rb
          grep -n root config/routes.rb

      - name: bin/rails desktop:runtime
        working-directory: ${{ env.FRESH }}
        run: bin/rails desktop:runtime

      - name: bin/rails desktop:package
        working-directory: ${{ env.FRESH }}
        run: |
          set -euo pipefail
          bin/rails desktop:package | tee "$RUNNER_TEMP/fresh-package.log"
          # The shell has to be the downloaded one: nothing has been built here.
          # Checked on what packaging reports, because pack.sh re-signs the
          # binary it embeds, so the bytes in the bundle differ on macOS.
          grep -E '^  shell: +.*/\.desktop-rails/shell/[^/]+/desktop-rails$' "$RUNNER_TEMP/fresh-package.log"

      - name: Launch it and check the window loaded the app
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            bin="$FRESH/.desktop-rails/dist/Fresh.app/Contents/MacOS/desktop-rails"
            tree="$FRESH/.desktop-rails/dist/Fresh.app"
          else
            bin="$FRESH/.desktop-rails/dist/fresh/fresh"
            tree="$FRESH/.desktop-rails/dist/fresh/lib/app"
          fi
          DESKTOP_DATA_DIR="$(mktemp -d)" ${{ matrix.platform.gui }} ruby desktop-rails/exe/desktop-rails-tool smoke app "$bin" \
            "text=Welcome#index" "unchanged=$tree"

      - name: The signature still verifies after running
        if: runner.os == 'macOS'
        run: codesign --verify --strict --deep "$FRESH/.desktop-rails/dist/Fresh.app"

      # ─── examples/notes, with the shell from this commit ───────────────────
      #
      # Run whether or not the fresh app passed, so one failure does not hide
      # another; the job still fails.

      - name: Shell build dependencies
        if: ${{ !cancelled() && matrix.rails.example && runner.os == 'Linux' }}
        run: |
          sudo apt-get install -y -qq build-essential libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf
          # The tray library is loaded at runtime, not linked. Without it the
          # shell must still open its window, with no tray.
          sudo apt-get remove -y -qq libayatana-appindicator3-1 libappindicator3-1 || true
          ! ldconfig -p | grep -q appindicator3

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() && matrix.rails.example }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() && matrix.rails.example }}
        with:
          workspaces: src-tauri

      - name: Build the shell
        if: ${{ !cancelled() && matrix.rails.example }}
        working-directory: src-tauri
        run: cargo build --release

      - name: Package the example
        if: ${{ !cancelled() && matrix.rails.example }}
        working-directory: examples/notes
        run: |
          set -euo pipefail
          bundle install
          bin/rails desktop:runtime
          bin/rails desktop:package | tee "$RUNNER_TEMP/notes-package.log"
          grep -E '^  shell: +.*/src-tauri/target/release/desktop-rails$' "$RUNNER_TEMP/notes-package.log"

      - name: Launch the example and drive both native directions
        if: ${{ !cancelled() && matrix.rails.example }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            bin="$PWD/examples/notes/.desktop-rails/dist/Notes.app/Contents/MacOS/desktop-rails"
            tree="$PWD/examples/notes/.desktop-rails/dist/Notes.app"
          else
            bin="$PWD/examples/notes/.desktop-rails/dist/notes/notes"
            tree="$PWD/examples/notes/.desktop-rails/dist/notes/lib/app"
          fi
          data="$RUNNER_TEMP/notes-data"
          rm -rf "$data" && mkdir -p "$data"
          # A model-backed page on an empty data directory proves the schema and
          # seeds were loaded; the reports prove the bridge worked in the window.
          DESKTOP_DATA_DIR="$data" ${{ matrix.platform.gui }} ruby desktop-rails/exe/desktop-rails-tool smoke app "$bin" \
            "text=Welcome to Notes" \
            "marker=javascript" \
            "marker=stream" \
            "request=/native/window" \
            "marker=ruby" \
            "unchanged=$tree"

      - name: The example's signature still verifies after running
        if: ${{ !cancelled() && matrix.rails.example && runner.os == 'macOS' }}
        run: codesign --verify --strict --deep examples/notes/.desktop-rails/dist/Notes.app

      # An update: the same data directory, a newer build with one more
      # migration. The seeded note is deleted first, so a second seeding would
      # show, and a note written by the first version must survive.
      - name: Update the example with a migration and launch it again
        if: ${{ !cancelled() && matrix.rails.example }}
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/notes-data"
          python3 - "$data/app.sqlite3" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.execute("DELETE FROM notes WHERE title = 'Welcome to Notes'")
          db.execute("INSERT INTO notes (title, created_at, updated_at) VALUES ('Kept across the update', datetime('now'), datetime('now'))")
          db.commit()
          PY
          (cd examples/notes && bin/rails generate migration AddPinnedToNotes pinned:boolean && bin/rails desktop:package)
          if [ "$RUNNER_OS" = macOS ]; then
            bin="$PWD/examples/notes/.desktop-rails/dist/Notes.app/Contents/MacOS/desktop-rails"
          else
            bin="$PWD/examples/notes/.desktop-rails/dist/notes/notes"
          fi
          rm -rf "$data/native-reports" "$data/log"
          DESKTOP_DATA_DIR="$data" ${{ matrix.platform.gui }} ruby desktop-rails/exe/desktop-rails-tool smoke app "$bin" \
            "text=Kept across the update"
          python3 - "$data/app.sqlite3" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          columns = [row[1] for row in db.execute("PRAGMA table_info(notes)")]
          assert "pinned" in columns, f"the pending migration did not run: {columns}"
          seeded = db.execute("SELECT COUNT(*) FROM notes WHERE title = 'Welcome to Notes'").fetchone()[0]
          assert seeded == 0, "seeds ran again on an existing database"
          print("OK    second launch: pending migration applied, data kept, seeds not rerun")
          PY

  windows:
    name: Windows (bundle shape)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FRESH: C:\fresh
    steps:
      - uses: actions/checkout@v4

      # A Ruby with a devkit to generate the app and compile its gems. The
      # interpreter that ships is the one desktop:runtime downloads.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: rails new, add the gem, run the generator
        shell: pwsh
        run: |
          gem install rails -v $env:RAILS_VERSION --no-document
          if ($LASTEXITCODE -ne 0) { throw "gem install failed" }
          rails "_$($env:RAILS_VERSION)_" new $env:FRESH --skip-git
          if ($LASTEXITCODE -ne 0) { throw "rails new failed" }
          Push-Location $env:FRESH
          # Forward slashes: bundle add writes the path into a double-quoted Ruby
          # string, where D:\a\... would be read as escape sequences.
          bundle add desktop-rails --path ((Join-Path $env:GITHUB_WORKSPACE "desktop-rails") -replace '\\', '/')
          if ($LASTEXITCODE -ne 0) { throw "bundle add failed" }
          ruby bin\rails generate desktop_rails:install
          if ($LASTEXITCODE -ne 0) { throw "the generator failed" }
          bundle install
          if ($LASTEXITCODE -ne 0) { throw "bundle install failed" }
          ruby bin\rails generate controller Welcome index
          if ($LASTEXITCODE -ne 0) { throw "generating a controller failed" }
          (Get-Content config\routes.rb) -replace '^Rails\.application\.routes\.draw do$', "`$0`n  root `"welcome#index`"" | Set-Content config\routes.rb
          Pop-Location

      - name: bin/rails desktop:runtime
        working-directory: ${{ env.FRESH }}
        run: ruby bin\rails desktop:runtime

      - name: bin/rails desktop:package
        working-directory: ${{ env.FRESH }}
        run: ruby bin\rails desktop:package

      - name: The GUI tree carries what it should
        shell: pwsh
        run: |
          $dir = "$env:FRESH\.desktop-rails\dist\fresh"
          foreach ($f in @("fresh.exe", "desktop-rails.config.json", "fresh.cmd", "lib\app\.bundle\config",
                           "lib\app\vendor\path-gems\desktop-rails\desktop-rails.gemspec", "lib\app\bin\desktop-boot")) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
            Write-Host "  present: $f"
          }
          foreach ($f in @("lib\app\.desktop-rails", "lib\app\config\master.key", "lib\app\storage")) {
            if (Test-Path "$dir\$f") { throw "$f must not ship" }
            Write-Host "  absent:  $f"
          }
          $config = Get-Content "$dir\desktop-rails.config.json" -Raw | ConvertFrom-Json
          if ($config.server.command -ne "fresh.cmd") {
            throw "the config points at $($config.server.command), which is not the launcher"
          }
          Write-Host "  config spawns $($config.server.command)"

      - name: Its server boots on a clean data directory
        shell: pwsh
        run: |
          $env:DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP "fresh-data"
          ruby desktop-rails\exe\desktop-rails-tool smoke launch "$env:FRESH\.desktop-rails\dist\fresh\fresh.cmd"
          if ($LASTEXITCODE -ne 0) { throw "the packaged app did not hold to its contract" }
