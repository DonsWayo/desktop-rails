[package]
name = "desktop-rails"
version = "0.3.0-pre.1"
description = "Turbo Native for Desktop — native shell for Rails/Turbo apps"
authors = ["Juan Carracedo", "aguspe"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
# Already in the tree via rustls; declared so the control token can use real
# OS entropy rather than the nanosecond counter used for window labels.
getrandom = "0.3"
url = "2"
# Already in the tree through tauri-plugin-updater; declared so the app's own
# installed version can be parsed and compared against a release manifest.
semver = "1"
log = "0.4"
env_logger = "0.11"
regex-lite = "0.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
# The mock runtime, so the control channel can be driven against a real app
# handle in tests without opening a window.
tauri = { version = "2", features = ["test"] }
# Both already in the tree through tauri-plugin-updater. tests/updater_signature.rs
# verifies the packaging scripts' output with the very crate the updater uses,
# rather than with a second reading of the minisign format.
minisign-verify = "0.2"
base64 = "0.22"

# Already in the tree through libappindicator-sys; declared so the shell can
# check for a tray library before creating a tray, which otherwise panics.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
